  <!-- GitHub Pages serves this page for any address it does not have, at
       that address: every link here is absolute. The home page's sheet
       gives it the same type, colours and buttons; no scripts beyond the
       theme, so nothing waits to be revealed. -->
  <link rel="stylesheet" href="/home.css?v=2026-10-28e" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    .lost {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      align-content: center;
      gap: 28px;
      padding-block: 48px;
    }
    .lost__home { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 600; font-size: 17px; }
    .lost__home svg { width: 28px; height: 28px; }
    .lost__code {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(110px, 24vw, 260px);
      line-height: 0.85;
      letter-spacing: -0.06em;
      color: var(--accent);
    }
    .lost__title { max-width: 14em; font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4.6vw, 54px); line-height: 1.05; letter-spacing: -0.04em; }
    .lost__title em { font-style: normal; color: var(--accent-2); }
    .lost p { max-width: 34em; color: var(--dim); }
    .lost__go { display: flex; flex-wrap: wrap; gap: 12px; }
  </style>
</head>

    <div class="lost__go">
      <a class="btn btn--ink" href="/"><span>Go to the home page</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></a>

      <a class="btn btn--line" href="/?mode=curious#quests">See the side quests</a>
    </div>
  </main>
